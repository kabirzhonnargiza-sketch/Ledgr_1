<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledgr — демо</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{--bg:#efeedc;--s1:#e7e6cb;--s2:#d9d6b4;--tx:#2b3a82;--mu:#4f5c94;--ln:#cdcaa8;--ac:#2b3a82;--acx:#eeeddc;--pos:#2a7a4b;--bad:#b3402a;--rc:#2b3a82;--rt:#eeeddc;--rpos:#a4e3b8;--rneg:#ffb09b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Onest,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
.hd{font-family:Unbounded,Onest,system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:14px clamp(16px,4vw,48px);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}.brand img{width:42px;height:42px;border-radius:50%}
.hc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.seg{display:inline-flex;background:var(--s1);border-radius:99px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:7px 14px;border-radius:99px;cursor:pointer;color:var(--mu);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ac);color:var(--acx)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
nav{display:flex;gap:4px;padding:0 clamp(16px,4vw,48px);border-bottom:1px solid var(--ln);overflow-x:auto}
nav button{border:0;background:none;padding:14px 16px;cursor:pointer;color:var(--mu);border-bottom:2px solid transparent;white-space:nowrap}
nav button[aria-selected=true]{color:var(--tx);border-color:var(--ac);font-weight:700}
main{padding:clamp(16px,4vw,48px);max-width:1240px;margin:auto}
h1{font:800 clamp(24px,4.4vw,44px)/1.1 Unbounded,Onest,sans-serif;letter-spacing:-.03em;margin:0 0 8px}
h2{font-size:18px;margin:0 0 12px}
.sub{color:var(--mu);margin:0 0 26px;max-width:640px}
.grid{display:grid;gap:20px}.two{grid-template-columns:minmax(0,440px) minmax(0,1fr)}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.card{background:var(--s1);border-radius:18px;padding:22px}
.receipt{background:var(--rc);color:var(--rt);border-radius:6px 6px 0 0;padding:24px 22px 18px;position:relative;font-variant-numeric:tabular-nums;margin-bottom:12px}
.receipt:after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:linear-gradient(-45deg,transparent 7px,var(--rc) 0) 0 0/14px 10px,linear-gradient(45deg,transparent 7px,var(--rc) 0) 0 0/14px 10px;transform:scaleY(-1)}
.receipt h3{margin:0 0 2px;font-size:13px;font-weight:500;opacity:.7}
.big{font:800 clamp(28px,6vw,44px)/1.1 Unbounded,Onest,sans-serif;letter-spacing:-.04em;margin:6px 0 14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dotted color-mix(in srgb,var(--rt) 40%,transparent)}
.row input{width:104px;text-align:right;background:transparent;border:1px solid color-mix(in srgb,var(--rt) 35%,transparent);border-radius:6px;padding:2px 6px}
.row input.nm{width:100%;max-width:170px;text-align:left}.row input:disabled{border-color:transparent}
.total{font-weight:800;font-size:17px;border:0;padding-top:12px}
.barcode{height:34px;margin-top:16px;background:repeating-linear-gradient(90deg,var(--rt) 0 2px,transparent 2px 4px,var(--rt) 4px 5px,transparent 5px 9px,var(--rt) 9px 12px,transparent 12px 14px)}
.pos{color:var(--pos)}.neg{color:var(--bad)}.receipt .pos{color:var(--rpos)}.receipt .neg{color:var(--rneg)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--mu);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--ln)}
td{padding:10px;border-bottom:1px solid var(--ln);vertical-align:middle}
td.n,th.n{text-align:right}.emp{color:var(--mu);text-align:center;padding:28px 10px}
td input{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:4px 8px;width:90px;text-align:right}
.scroll{overflow-x:auto}
.bar{height:8px;border-radius:4px;background:var(--s2);min-width:80px;overflow:hidden}.bar b{display:block;height:100%;background:var(--ac)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--s2);font-size:12px;color:var(--mu)}
.pill.warn{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}.pill.ok{background:color-mix(in srgb,var(--pos) 22%,transparent);color:var(--pos)}
.btn{border:0;border-radius:99px;padding:9px 18px;background:var(--ac);color:var(--acx);font-weight:700;cursor:pointer}
.btn.ghost{background:var(--s2);color:var(--tx);font-weight:500}.btn.sm{padding:4px 12px;font-size:13px}
.receipt .btn.ghost{background:color-mix(in srgb,var(--rt) 15%,transparent);color:var(--rt)}
.x{border:0;background:none;cursor:pointer;color:var(--mu);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}.x:hover{color:var(--bad)}
.receipt .x{color:var(--rt);opacity:.7}
.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:14px 0}
.f label{display:grid;gap:4px;font-size:13px;color:var(--mu)}
.f input,.f select{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;width:100%}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.cmp .card{cursor:pointer;border:1px solid transparent;text-align:left}.cmp .card[aria-pressed=true]{border-color:var(--ac)}
.cmp .card.add{background:none;border:1px dashed var(--mu);color:var(--mu);display:grid;place-items:center;min-height:110px}
.cmp .v{font:800 22px Unbounded,Onest,sans-serif;letter-spacing:-.03em}
.imp{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px;padding-top:14px;border-top:1px solid var(--ln)}
.imp small{color:var(--mu);flex:1 1 260px}
dialog{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:18px;padding:22px;width:min(560px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(20,26,70,.6)}
code{font:500 15px ui-monospace,Menlo,monospace;background:var(--s2);padding:3px 8px;border-radius:6px;letter-spacing:.04em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:var(--acx);padding:10px 18px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center;z-index:9}
.toast.on{opacity:1}
.auth{display:grid;grid-template-columns:1.15fr 1fr;min-height:100vh}
.hero{background:#40589b var(--bn) center/cover;color:#eeeddc;padding:clamp(24px,5vw,56px);display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.hero img{width:clamp(90px,12vw,140px);border-radius:50%}
.hero h1{color:#eeeddc;max-width:12em}.hero p{max-width:30em;opacity:.9;margin:0}
.fm{padding:clamp(24px,5vw,56px);display:flex;flex-direction:column;justify-content:center;max-width:520px;width:100%;margin:auto}
.fm .f{grid-template-columns:1fr}.fm .note{color:var(--mu);font-size:13px;margin-top:14px}
.cred{display:grid;gap:12px;margin:14px 0}.cred small{display:block;color:var(--mu)}.cred code{font-size:17px}
@media(max-width:860px){.auth{grid-template-columns:1fr}.hero{min-height:260px;gap:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
td select{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:4px}#sv{white-space:nowrap}.imp{border-top:0}
</style></head><body>
<div id="auth" hidden></div>
<div id="app" hidden>
<header>
  <div class="brand"><img id="lg" alt="Ledgr"><span id="co"></span></div>
  <div class="hc"><div class="seg" id="cafes" role="group" aria-label="Кофейня"></div><span id="addc"></span></div>
  <div class="hc"><span class="pill" id="sv"></span><div class="seg" id="roles" role="group" aria-label="Роль"></div><button class="btn ghost sm" data-act="resetdemo">Сбросить демо</button></div>
</header>
<nav id="tabs" role="tablist"></nav>
<main id="view"></main>
</div>
<dialog id="dlg"><form data-form="cafe"><h2>Новая кофейня</h2><div class="f" style="grid-template-columns:1fr"><label>Название<input name="n" required></label></div><button class="btn">Добавить</button> <button class="btn ghost" type="button" data-act="close">Отмена</button></form></dialog>
<dialog id="rdlg"><div class="in"></div><button class="btn ghost" data-act="rclose" style="margin-top:14px">Закрыть</button></dialog>
<div class="toast" id="toast" role="status"></div>

async function put(path,obj){const j=JSON.stringify(obj);if(sync.last[path]===j)return;await DB.doc(path).set({json:j});sync.last[path]=j}
async function pushDb(){const lg=state.acc;if(!DB||!lg)return;await put('books/'+lg,{cafes:state.cafes.map(c=>({...c,shifts:[]})),menu:state.menu,goods:state.goods,users:state.users});for(const c of state.cafes)await put(`shifts/${lg}_${c.id}`,c.shifts);for(const p of Object.keys(sync.last))if(p.startsWith(`shifts/${lg}_`)&&!state.cafes.some(c=>p==`shifts/${lg}_${c.id}`)){await DB.doc(p).delete();delete sync.last[p]}sync.pending=false;sync.err=false;setSv()}
